name: OCI ARM VM retry

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      - name: Write OCI config
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=ocid1.user.oc1..aaaaaaaa3kittvu6yuqabigqqdfpjnlnhpliwhn3qpkcxhwrd2mhfxveldzq
          fingerprint=a0:2b:75:1c:2e:73:a6:5a:48:37:92:d1:9a:5e:b7:6f
          tenancy=ocid1.tenancy.oc1..aaaaaaaapdsseekeu76fqizickfz2gawyhdggvloa5jzxnmb7h46kjbotgaa
          region=eu-frankfurt-1
          key_file=~/.oci/oci_api_key.pem
          EOF

      - name: Check if VM already exists
        id: check_vm
        run: |
          TENANCY="ocid1.tenancy.oc1..aaaaaaaapdsseekeu76fqizickfz2gawyhdggvloa5jzxnmb7h46kjbotgaa"
          RESULT=$(oci compute instance list \
            --compartment-id "$TENANCY" \
            --display-name myinvoice \
            --lifecycle-state RUNNING 2>/dev/null || echo '{"data":[]}')
          COUNT=$(echo "$RESULT" | grep -c '"lifecycle-state"' || true)
          [ -z "$COUNT" ] && COUNT=0
          echo "Running instance count: $COUNT"
          echo "running=$COUNT" >> $GITHUB_OUTPUT

      - name: VM already running
        if: steps.check_vm.outputs.running != '0'
        run: |
          echo "VM myinvoice uz bezi. Zastavte workflow rucne v GitHub Actions."
          curl -s -X POST https://ntfy.sh/myinvoice-oci-gzjerfpw1hpw \
            -H "Title: OCI myinvoice" \
            -H "Tags: white_check_mark" \
            -d "VM uz bezi - workflow zastaven. Zkontroluj OCI Console."

      - name: Try launch in each AD
        if: steps.check_vm.outputs.running == '0'
        run: |
          TENANCY="ocid1.tenancy.oc1..aaaaaaaapdsseekeu76fqizickfz2gawyhdggvloa5jzxnmb7h46kjbotgaa"
          SUBNET="ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaabqcplor4wp2vop3tyx6xcdhmpgvefildvy5qgy6luwgje3hscyjq"
          IMAGE="ocid1.image.oc1.eu-frankfurt-1.aaaaaaaafa6df4ne6anvdzb5k5gqz6veykx2pmu7padzkxzy4ognjhty7pma"
          SSH_KEY="${{ secrets.VM_SSH_PUBLIC_KEY }}"

          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          export SUPPRESS_LABEL_WARNING=True

          for AD in EU-FRANKFURT-1-AD-1 EU-FRANKFURT-1-AD-2 EU-FRANKFURT-1-AD-3; do
            echo "--- Zkousim AD: $AD ---"
            # Pouzivame 'if', cimz obejdeme 'set -e' ktery GitHub Actions zapina automaticky.
            # Bez 'if' by bash exitoval okamzite na non-zero exit code z oci.
            if oci compute instance launch \
              --compartment-id "$TENANCY" \
              --availability-domain "EVmv:$AD" \
              --display-name "myinvoice" \
              --image-id "$IMAGE" \
              --subnet-id "$SUBNET" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":1,"memoryInGBs":6}' \
              --assign-public-ip true \
              --ssh-authorized-keys-file <(echo "$SSH_KEY") \
              > /tmp/out.txt 2>&1; then
              # Launch API vratil 200 OK - instance se vytvari
              INSTANCE_ID=$(python3 -c "import json; d=json.load(open('/tmp/out.txt')); print(d['data']['id'])" 2>/dev/null || echo "")
              echo "Instance vytvorena: $INSTANCE_ID — cekam na RUNNING..."
              for i in $(seq 1 20); do
                sleep 30
                STATE=$(oci compute instance get --instance-id "$INSTANCE_ID" \
                  --query 'data."lifecycle-state"' --raw-output 2>/dev/null || echo "UNKNOWN")
                IP=$(oci compute instance get --instance-id "$INSTANCE_ID" \
                  --query 'data."public-ip"' --raw-output 2>/dev/null || echo "")
                echo "  Pokus $i/20: stav=$STATE IP=$IP"
                if [ "$STATE" = "RUNNING" ]; then
                  echo "VM spustena! IP: $IP"
                  curl -s -X POST https://ntfy.sh/myinvoice-oci-gzjerfpw1hpw \
                    -H "Title: OCI VM je hotova!" \
                    -H "Priority: high" \
                    -H "Tags: rocket" \
                    -d "myinvoice VM bezi na IP: $IP | SSH: ssh -i myinvoice_vm_key ubuntu@$IP"
                  exit 0
                fi
                if [ "$STATE" = "TERMINATED" ] || [ "$STATE" = "TERMINATING" ]; then
                  echo "  Instance skoncila v $STATE — pokracuji na dalsi AD"
                  break
                fi
              done
              echo "  Timeout cekani na RUNNING pro $AD"
            else
              echo "$AD: kapacita nedostupna"
              cat /tmp/out.txt | grep -i "message\|error\|Error" | head -3 || true
            fi
          done

          echo "Vsechny AD plne nebo timeout. Zkusim znovu za 10 minut."
          exit 0
